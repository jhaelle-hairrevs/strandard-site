<!DOCTYPE html>
<html>
<head>
<title>Delete Account</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/delete.js" defer></script>
</head>
<body>
<h2>Delete Your Strandard Account</h2>

<form id="deleteForm">
<input type="email" id="email" placeholder="Email" required>
<textarea id="reason" placeholder="Reason"></textarea>

<p>Select deletion preference:</p>
<label><input type="radio" name="delete_option" value="data_only" required> Delete my data only</label>
<label><input type="radio" name="delete_option" value="account_keep_data"> Delete my account but keep my data</label>
<label><input type="radio" name="delete_option" value="delete_both"> Delete both account and data</label>

<button type="submit">Submit</button>
<div id="message"></div>
</form>
</body>
</html>
